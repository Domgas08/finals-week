# Production setup: the web app, PostgreSQL and a Cloudflare Tunnel on one server.
# Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Settings come from deploy/.env (copy deploy/.env.example). See docs/deploy.md.

name: finals-week

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finalsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-finals-week}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No "ports:" in this file on purpose. Nothing is opened on the server.
    # The containers reach each other by service name ("db", "web").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-finals-week};Username=${POSTGRES_USER:-finalsuser};Password=${POSTGRES_PASSWORD}"
    volumes:
      - dp-keys:/home/app/.aspnet/DataProtection-Keys

  # Connects out to Cloudflare. Cloudflare serves https://<your subdomain>
  # and sends the traffic through this tunnel to http://web:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - web

volumes:
  db-data:
  dp-keys:
