name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  COVERAGE_THRESHOLD: 90

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --configuration Release --verbosity normal /p:CollectCoverage=true /p:ExcludeByFile="**/Migrations/*.cs" /p:Threshold=$COVERAGE_THRESHOLD /p:ThresholdType=line /p:ThresholdStat=total