name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  COVERAGE_THRESHOLD: 50

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit)
        run: >
          dotnet test tests/FinalsWeek.Core.Tests --no-build --configuration Release --verbosity normal
          /p:CollectCoverage=true
          /p:ExcludeByFile="**/Migrations/*.cs"
          /p:CoverletOutputFormat=json
          /p:CoverletOutput=${{ github.workspace }}/coverage/

      - name: Test (integration, merged coverage and threshold)
        run: >
          dotnet test tests/FinalsWeek.IntegrationTests --no-build --configuration Release --verbosity normal
          /p:CollectCoverage=true
          /p:ExcludeByFile="**/Migrations/*.cs"
          /p:MergeWith=${{ github.workspace }}/coverage/coverage.json
          /p:CoverletOutputFormat=\"json,cobertura\"
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:Threshold=$COVERAGE_THRESHOLD /p:ThresholdType=line /p:ThresholdStat=total

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool 
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:MarkdownSummaryGithub 
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY


  # After a merge to main, and only if build and tests passed: ask our server
  # to deploy. The n8n webhook answers at once and runs the deploy over SSH.
  # Setup: "Deploy from GitHub through n8n" in docs/deploy.md.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}

    steps:
      - name: Ask the server to deploy
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: >
          curl --fail-with-body --silent --show-error --max-time 30
          -X POST
          -H "X-Deploy-Token: $DEPLOY_WEBHOOK_TOKEN"
          -H "Content-Type: application/json"
          -d '{"commit": "${{ github.sha }}"}'
          "$DEPLOY_WEBHOOK_URL"

      - name: Skip (deploy webhook not configured)
        if: env.DEPLOY_WEBHOOK_URL == ''
        run: echo "DEPLOY_WEBHOOK_URL secret is not set, so nothing was deployed."

